<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Shop Leandro Bertotto – Turnos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--fg:#f2ede2;--mut:#8d887c;--gold:#c9a24a;--line:#2a2823;--card:#0d0c0a}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1,h2{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:600;letter-spacing:.04em;margin:0}
h2{font-size:22px;color:var(--gold);margin:36px 0 12px}
header{text-align:center}header img{max-width:100%;width:340px;height:auto}
.info{display:flex;flex-direction:column;gap:2px;text-align:center;color:var(--mut);margin-top:10px;font-size:15px}
.links{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
a.btn,button.btn{display:inline-block;border:1px solid var(--gold);color:var(--gold);background:none;padding:10px 18px;border-radius:2px;text-decoration:none;font:500 15px Barlow,sans-serif;cursor:pointer}
a.btn:hover,button.btn:hover{background:var(--gold);color:#000}
button.solid{background:var(--gold);color:#000;width:100%;margin-top:16px;padding:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);padding:14px;cursor:pointer;border-radius:2px}
.opt b{display:block;font-weight:500}.opt span{color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:20px}
.opt.on{border-color:var(--gold);background:var(--card)}
.days,.times{display:flex;gap:8px;flex-wrap:wrap}
.days{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);padding:8px 12px;border-radius:2px;font:500 15px Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--gold);background:var(--gold);color:#000}
.chip:disabled{color:#4a473f;text-decoration:line-through;cursor:not-allowed}
.times .chip{min-width:72px}
input[type=text],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:12px;border-radius:2px;font:inherit}
input:focus,.chip:focus-visible,.opt:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{margin-top:14px;padding:12px;border:1px solid var(--line);color:var(--mut);font-size:15px}
.msg.ok{border-color:var(--gold);color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--mut);display:block}.row .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px}
.dayh{color:var(--gold);margin:18px 0 2px;font-weight:500}
footer{text-align:center;margin-top:48px}footer button{background:none;border:0;color:#5b574d;font:14px Barlow;cursor:pointer}
[hidden]{display:none!important}

body{background:radial-gradient(ellipse 90% 45% at 50% 0%,#2b2210 0%,#000 70%) fixed,#000}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bg .pole{position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,#000 10px 20px,#f2ede2 20px 30px,#000 30px 40px);opacity:.75}
main{position:relative;z-index:1}
.sep{display:flex;align-items:center
